<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WGate 隐私政策</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.7 -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f2f2f4; background: #1c1b1f;
  }
  main { max-width: 34rem; padding: 2rem 1.25rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .6rem; }
  p { color: #8d9d9f; margin: 0 0 1.1rem; }
  a.open {
    display: inline-block; padding: .7rem 1.25rem; border-radius: 999px;
    background: #76bebd; color: #101013; text-decoration: none; font-weight: 600;
  }
  code { color: #8d9d9f; font-size: .8rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>WGate 隐私政策</h1>
  <p>本应用的隐私政策由华为应用市场的协议服务生成并托管，正在为你打开；如果没有自动跳转，点下面的按钮。</p>
  <p><a class="open" id="open" href="https://agreement-drcn.hispace.dbankcloud.cn/index.html?lang=zh&agreementId=2069872513088805568">打开隐私政策</a></p>
  <p><code id="id">agreementId=2069872513088805568</code></p>
  <p>
    <a href="https://agreement-drcn.hispace.dbankcloud.cn/index.html?lang=zh&agreementId=2069872513088805568">简体中文</a> ·
    <a href="https://agreement-drcn.hispace.dbankcloud.cn/index.html?lang=zh-Hant-TW&agreementId=2069887177466076864">繁體中文</a> ·
    <a href="https://agreement-drcn.hispace.dbankcloud.cn/index.html?lang=en&agreementId=2069895149739073216">English</a>
  </p>
</main>
<script>
  // Each language is a separate agreement on Huawei's side, with its own id.
  var AGREEMENTS = {
    zh: 'https://agreement-drcn.hispace.dbankcloud.cn/index.html?lang=zh&agreementId=2069872513088805568',
    hant: 'https://agreement-drcn.hispace.dbankcloud.cn/index.html?lang=zh-Hant-TW&agreementId=2069887177466076864',
    en: 'https://agreement-drcn.hispace.dbankcloud.cn/index.html?lang=en&agreementId=2069895149739073216'
  };
  var tag = navigator.language || 'zh-CN';
  var key = /^en/i.test(tag) ? 'en' : (/hant|tw|hk/i.test(tag) ? 'hant' : 'zh');
  var target = AGREEMENTS[key];
  document.getElementById('open').href = target;
  document.getElementById('id').textContent = 'agreementId=' + target.split('agreementId=')[1];
  if (location.search.indexOf('stay') < 0) { location.replace(target); }
</script>
</body>
</html>
